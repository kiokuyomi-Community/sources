name: Test distribution tooling

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['scripts/**', 'tests/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
